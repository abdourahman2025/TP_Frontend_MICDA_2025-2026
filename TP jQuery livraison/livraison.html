<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation de livraison</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body { 
            font-family: Arial; 
            padding: 20px;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        #route {
            position: relative;
            width: 100%;
            height: 100px;
            background: rgb(107, 106, 106);
            border: 2px solid #999;
            margin: 20px 0;
        }

        #camion {
            position: absolute;
            left: 0;
            top: 15px;
            font-size: 42px;
            transform: scaleX(-1);
        }

        button {
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Simulation de livraison 🚚</h2>

    <div id="route">
        <div id="camion">🚚</div>
    </div>

    <button id="demarrer">Démarrer</button>
    <button id="stop1">Stop 1</button>
    <button id="stop2">Stop 2</button>
    <button id="stop3">Stop 3</button>
    <button id="stop4">Stop 4</button>
    <button id="reset">Réinitialiser</button>

    <script>
        $(document).ready(function () {

            let camion = $("#camion");

            $("#demarrer").click(function () {
                camion.stop(true);                 
                camion.animate({ left: 600 }, 1500)
                      .animate({ left: 1200 }, 1500);
            });

            $("#stop1").click(function () {
                camion.stop();
            });

            $("#stop2").click(function () {
                camion.stop(true);
            });

            $("#stop3").click(function () {
                camion.stop(true, true);
            });

            $("#stop4").click(function () {
                camion.stop(false, true);
            });

            $("#reset").click(function () {
                camion.stop(true).css("left", 0);
            });

        });
    </script>
</body>
</html>
